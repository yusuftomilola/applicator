name: Fetch job listings

on:
  schedule:
    # 04:00 UTC daily, ~1 hour before the job-digest routine runs at 05:05 UTC
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch job board APIs
        run: |
          mkdir -p data
          curl -sS -m 30 -A "Mozilla/5.0 (compatible; JobDigestBot/1.0)" \
            "https://remoteok.com/api" -o data/remoteok.json || echo "[]" > data/remoteok.json
          curl -sS -m 30 -A "Mozilla/5.0 (compatible; JobDigestBot/1.0)" \
            "https://www.arbeitnow.com/api/job-board-api" -o data/arbeitnow.json || echo "{}" > data/arbeitnow.json
          curl -sS -m 30 -A "Mozilla/5.0 (compatible; JobDigestBot/1.0)" \
            "https://remotive.com/api/remote-jobs?category=software-dev" -o data/remotive.json || echo "{}" > data/remotive.json
          echo "{\"fetched_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/fetched_at.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/remoteok.json data/arbeitnow.json data/remotive.json data/fetched_at.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh job listings data"
          git push
